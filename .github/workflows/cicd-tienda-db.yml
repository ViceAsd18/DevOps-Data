name: CI/CD Tienda Perritos - DB

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build imagen DB y push a Docker Hub
      run: |
        # Eliminamos el 'cd db' porque el Dockerfile está en la raíz del repo
        docker build -t ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest .
        docker tag ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest

    - name: Desplegar DB vía SSM (Método del Profe)
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-db desde Docker Hub" \
          --parameters '{"commands":[
            "set -e",
            "docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}",
            "docker pull ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest",
            "docker stop tienda-db || true",
            "docker rm tienda-db || true",
            "docker run -d --name tienda-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.DOCKER_USERNAME }}/tienda-db:latest"
          ]}' \
          --output text